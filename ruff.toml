# ruff.toml — Ruff lint + format for elib (used by local dev, pre-commit, CI)

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    # Scratch / ad-hoc scripts (not part of the package)
    "examples",
    "transmute",
]

line-length = 100
indent-width = 4
target-version = "py313"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate (commented-out code)
    "PL",  # Pylint
    "RUF", # Ruff-specific
]

ignore = [
    "E501",    # line length — formatter
    "B008",    # function calls in defaults (Typer/FastAPI pattern)
    "C901",    # complexity
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLR0911", # too many return statements
    "PLR2004", # magic value comparisons (common in parsers/tests)
    "PLC0415", # import not at top — intentional lazy imports
    "PLW0603", # global statement (rate limiter singletons)
    "UP042",   # str + Enum — keep for Typer/string enums
    "TC001",   # typing-only first-party import
    "TC002",   # typing-only third-party import
    "TC003",   # typing-only stdlib import
    "PTH123",  # open() vs Path.open — gradual migration
    "ERA001",  # commented-out code — clean up over time
    "SIM105",  # contextlib.suppress
    "SIM108",  # ternary if
    "RUF001",  # ambiguous unicode in strings (en-dash, etc.)
    "RUF005",  # collection literal concatenation
    "RUF012",  # mutable class default (Pydantic models)
    "C408",    # unnecessary dict/list call
]

fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*.py" = [
    "S101",
    "ARG",
    "PLR0913",
    "PLR2004",
    "B017",   # pytest.raises(Exception) in some tests
    "E402",   # local imports in test helpers
]
"src/symworx_elibrary/migrations/**/*.py" = ["E402", "ARG"]
"src/symworx_elibrary/cli/**/*.py" = ["ARG001", "PLR0913"]  # Typer injects unused ctx; CLI cmds take many options

[lint.mccabe]
max-complexity = 10

[lint.isort]
known-first-party = ["symworx_elibrary"]
force-sort-within-sections = true
split-on-trailing-comma = true

[lint.pydocstyle]
convention = "google"

[lint.pylint]
max-args = 8
max-branches = 15
max-returns = 8
max-statements = 60

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
