# Day-to-day CI for elib (SymWorx-style gates, Python edition).
# Release/publish automation stays separate and optional (see docs/RELEASING.md).

name: CI

on:
  push:
    branches: [develop, main, stage, "release/**"]
  pull_request:
    branches: [develop, main, stage]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dev tools
        run: uv sync --group dev --no-install-project

      - name: Ruff format check
        run: uv run --group dev ruff format --check .

      - name: Ruff lint
        run: uv run --group dev ruff check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync project + dev
        run: uv sync --group dev

      - name: Run tests
        run: uv run --group dev pytest
