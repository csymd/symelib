# Day-to-day CI.
#
# Branch model (same as SymWorx / SymKit / SymSight):
#   develop → stage → release/vX.Y.Z → main → manual tag vX.Y.Z
#
# Day-to-day CI on develop only. stage/main are promotions of that SHA.
# Tag / release.yml re-runs the full gate (and creates the GitHub Release).
# workflow_dispatch re-runs this gate on a branch (checks only; no publish).
#
# Job ids match develop required checks (no `name:` so GitHub reports
# fmt / check).

name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dev tools
        run: uv sync --group dev --no-install-project

      - name: Ruff format check
        run: uv run --group dev ruff format --check .

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync project + dev
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run --group dev ruff check .

      - name: Pytest
        run: uv run --group dev pytest
