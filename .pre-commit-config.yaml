# Local git hooks only (no GitHub Actions yet).
#
# Install once per clone:
#   make pre-commit-install
#
# Run on everything:
#   make pre-commit-run
#
# Skip one commit (rare):  git commit --no-verify
#
# Scope: formatting + import sort + light file hygiene.
# Full lint (`make lint` / `make check`) is still the PR bar; the tree has
# pre-existing Ruff findings that would block every commit if enforced here.

default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      # Import sorting (isort rules) — auto-fix, formatting-adjacent
      - id: ruff-check
        args: [--fix, --select, I]
      # Black-compatible formatter (uses ruff.toml [format])
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.pdf$'
      - id: end-of-file-fixer
        exclude: '\.pdf$'
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
